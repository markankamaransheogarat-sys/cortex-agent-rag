[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-agent-rag"
version = "1.0.0"
description = "🧠 Production Multi-Agent RAG Engine with Semantic Caching, Cross-Encoder Reranking & Hallucination Guard"
readme = "README.md"
authors = [{ name = "Konstantin", email = "markankamaransheogarat-sys@users.noreply.github.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]
